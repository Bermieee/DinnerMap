name: dinnermap
description: Household meal planning and grocery lists.
publish_to: none
version: 0.6.1+12
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: 2.18.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  file_saver: ^0.3.1
  share_plus: ^12.0.1
  printing: ^5.14.2
  pdf: ^3.11.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/recipes.json
